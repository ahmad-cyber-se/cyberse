name: Validate Vercel migration

on:
  push:
    branches: [vercel-migration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/cyberse
      DATABASE_SSL: disable
      JWT_SECRET: validation-only-secret-at-least-32-characters-long
      NEXT_PUBLIC_APP_URL: https://cybersehq.com
      BLOB_READ_WRITE_TOKEN: validation-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit migration surface
        run: |
          node scripts/materialize-migration.mjs
          test -s components/CyberSEApp.tsx
          test -s app/api/portal/'[...path]'/route.ts
          test -s app/globals.css
          if grep -R "@floot/" app components lib; then
            echo "Floot-only runtime imports remain in the Vercel migration" >&2
            exit 1
          fi
          if grep -R -E "(/_api/|/_cdn/|\.floot\.app)" app components lib; then
            echo "Floot-only runtime URLs remain in the Vercel migration" >&2
            exit 1
          fi
          echo "Portal route handlers:"
          grep -oE "path===['\"][^'\"]+['\"]" app/api/portal/'[...path]'/route.ts | sort -u || true
          echo "Migrated UI live-transport references:"
          grep -niE "realtime|presence|push|engagement-messages|messages" components/CyberSEApp.tsx | head -80 || true
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
