name: Validate Vercel migration

on:
  push:
    branches: [vercel-migration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/cyberse
      DATABASE_SSL: disable
      JWT_SECRET: validation-only-secret-at-least-32-characters-long
      NEXT_PUBLIC_APP_URL: https://cybersehq.com
      BLOB_READ_WRITE_TOKEN: validation-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Inspect recovered source
        run: |
          node scripts/materialize-migration.mjs
          nl -ba components/CyberSEApp.tsx | sed -n '70,90p'
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
