name: Deploy CyberSE to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyberse-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_emD5Alk8bAALnjVupClBBKRy
      VERCEL_PROJECT_ID: prj_ntvZPmuu9HMu1eszxbeQ58DbKS2t
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Vercel credential is configured
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is not configured." >&2
            exit 2
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Pull Vercel production configuration
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build with Vercel
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt production bundle
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
