name: Deploy CyberSE to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyberse-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_emD5Alk8bAALnjVupClBBKRy
      VERCEL_PROJECT_ID: prj_ntvZPmuu9HMu1eszxbeQ58DbKS2t
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Vercel credential
        id: credentials
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Vercel deployment credential is available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is not configured; deployment is safely skipped."
          fi
      - name: Install dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm install --no-audit --no-fund
      - name: Pull Vercel production configuration
        if: steps.credentials.outputs.available == 'true'
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build with Vercel
        if: steps.credentials.outputs.available == 'true'
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt production bundle
        if: steps.credentials.outputs.available == 'true'
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
